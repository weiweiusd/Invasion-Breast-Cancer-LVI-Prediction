 * The input order matches the fitted model's six feature coefficients.
 * Training-set ROC Youden cutoff: maximum (sensitivity + specificity - 1).
 * No individual patient rows or identifiers are published in this file.
 * Verify the definition of class 1 (LVI-positive) before clinical research use.
 */
"use strict";
globalThis.LVI_MODEL = Object.freeze({

  "version": "1.1",
  "classes": [
    0,
    1
  ],
  "threshold": 0.3210826514929313,
  "thresholdMethod": "Maximum Youden index (training ROC; n=903)",
  "intercept": -3.3176541594184323,
  "referenceSize": 903,
  "referenceSource": "train.csv (training-set means)",
  "trainingPerformance": {

  },
  "features": [
    {

    },
    {

      "observedMin": 6.0,

    },
    {
      "key": "Age",

      "coeff": -0.03159744009668163,

    },
    {

      "coeff": 0.6135910332349578,

    {

});

/* Exact browser-side evaluation of a fitted binary sklearn LogisticRegression.
 * The contribution identity is additive in log-odds space, not probability space.
 */
"use strict";
(function(root){
  function logistic(z) {
    if (z >= 0) return 1 / (1 + Math.exp(-z));
    const t = Math.exp(z);
    return t / (1 + t);
  }
  function score(model, patient) {
    let logit = model.intercept;
    let base = model.intercept;
    const contributions = model.features.map(feature => {
      const value = Number(patient[feature.key]);
      if (!Number.isFinite(value)) throw new Error(feature.key + ' must be a valid number');
      logit += feature.coeff * value;
      base += feature.coeff * feature.mean;
      return { ...feature, value, shap: feature.coeff * (value - feature.mean) };
    });
    const additive = base + contributions.reduce((sum, item) => sum + item.shap, 0);
    if (Math.abs(additive - logit) > 1e-9) throw new Error('Feature contributions do not sum to the model output');
    return {logit, base, probability:logistic(logit), baselineProbability:logistic(base), contributions, predictedClass:logistic(logit) >= model.threshold ? 1 : 0};
  }
  root.LVI_CORE = Object.freeze({logistic, score});
})(globalThis);

"use strict";
(() => {
  const model = globalThis.LVI_MODEL;
  const core = globalThis.LVI_CORE;
  const byId = id => document.getElementById(id);
  const inputIds = {
    "US-ALNs":"f-us-alns",
    "Size":"f-size",
    "Age":"f-age",
    "Peri3_svm_prob":"f-peri",
    "Hab_logistic_prob":"f-hab",
    "DL_prob_class1":"f-dl"
  };
  const probabilityKeys = new Set([
    "Peri3_svm_prob", "Hab_logistic_prob", "DL_prob_class1"
  ]);
  const probabilityInputIds = ["f-peri", "f-hab", "f-dl"];
  const isThreeDecimals = value =>
    Math.abs(value * 1000 - Math.round(value * 1000)) < 1e-8;
  const svgNS = 'http://www.w3.org/2000/svg';

  function node(type, attrs = {}, text = null) {
    const el = document.createElementNS(svgNS, type);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, String(value)));
    if (text !== null) el.textContent = text;
    return el;
  }
  function svgText(parent, x, y, text, extra={}) {
    const el = node('text', {x,y,'text-anchor':'middle','font-size':12,fill:'#171717','font-family':'Inter,Segoe UI,Arial,sans-serif',...extra},text);
    parent.appendChild(el);
    return el;
  }
  function fmt(n, digits=3) { return Number(n).toFixed(digits); }
  function signed(n, digits=3) { return (n>=0?'+':'')+fmt(n,digits); }
  function pct(n) { return (n*100).toFixed(2)+'%'; }
  function currentPatient() {
    const values={};
    for (const feature of model.features) {
      const input=byId(inputIds[feature.key]);
      const raw=input.value.trim();
      if (!raw) throw new Error('Enter a value for ' + feature.key);
      const num=Number(raw);
      if (!Number.isFinite(num)) throw new Error(feature.key + ' must be a valid number');
      const min=Number(input.min),max=Number(input.max);
      if (input.tagName !== 'SELECT' && (num<min || num>max)) {
        throw new Error(probabilityKeys.has(feature.key)
          ? feature.short + ' must be between 0.000 and 1.000.'
          : feature.key + ` must be between ${min} and ${max}`);
      }
      if (feature.key==='US-ALNs' && num!==0 && num!==1) throw new Error('US-ALNs must be either 0 or 1');
      if (probabilityKeys.has(feature.key)) {
        if (!isThreeDecimals(num)) {
          throw new Error(feature.short + ' must be between 0.000 and 1.000 with up to three decimal places.');
        }
        input.value = num.toFixed(3);
      }
      values[feature.key]=num;
    }
    return values;
  }
  function predict() {
    const error=byId('validation-error');
    error.hidden=true;
    try {
      const values=currentPatient();
      const result=core.score(model,values);
      renderResult(result);
      return result;
    } catch(e) {
      error.textContent=e instanceof Error ? e.message : String(e);
      error.hidden=false;
      console.error('Prediction failed:', e);
      return null;
    }
  }
  function renderResult(r) {
    byId('probability-value').textContent=pct(r.probability);
    byId('probability-meter').style.width=(r.probability*100)+'%';
    const cls=byId('classification-badge');
    cls.textContent=r.predictedClass===1?'LVI+ (1)':'LVI− (0)';
    cls.classList.toggle('is-positive',r.predictedClass===1);
    byId('classification-detail').textContent=r.predictedClass===1?'Probability is at or above the decision threshold.':'Probability is below the decision threshold.';
    // Interpretation text was removed from the streamlined interface.
    // Keep rendering independent of optional explanatory elements.
    renderForce(r);
  }
  function segmentArrow(svg, a, b, y, dir, fill) {
    if (b-a <= 0.1) return;
    const h=34, half=h/2, tip=Math.min(14,(b-a)*0.30);
    const pts=dir==='right'
      ? [[a,y-half],[b-tip,y-half],[b,y],[b-tip,y+half],[a,y+half]]
      : [[a+tip,y-half],[b,y-half],[b,y+half],[a+tip,y+half],[a,y]];
    svg.appendChild(node('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill,stroke:'#ffffff','stroke-width':1.5,'stroke-linejoin':'round'}));
  }
  function layoutLabels(items, maxRows=3) {
    const rows=Array.from({length:maxRows},()=>[]);
    const ordered=[...items].sort((a,b)=>a.mid-b.mid);
    for(const d of ordered) {
      const width=Math.min(148,Math.max(100,d.label.length*7.1+12));
      let best=null;
      for(let row=0;row<maxRows;row++) {
        const last=rows[row].at(-1);
        const lastRight=last?last.labelX+last.labelWidth/2:-Infinity;
        const leftEdge=lastRight+9;
        const ideal=Math.min(932-width/2,Math.max(68+width/2,d.mid));
        const place=Math.max(ideal,leftEdge+width/2);
        const over=Math.max(0,place+width/2-935);
        const cost=(place-ideal)*1.2+over*15+row*1.7;
        if(best===null || cost<best.cost) best={row,place,cost};
      }
      d.labelX=Math.max(64+width/2,Math.min(936-width/2,best.place));
      d.labelWidth=width;
      d.row=best.row;
      rows[best.row].push(d);
    }
  }
  function renderForce(r) {
    const svg=byId('force-svg');
    svg.replaceChildren();
    const positives=r.contributions.filter(d=>d.shap>0).sort((a,b)=>Math.abs(b.shap)-Math.abs(a.shap));
    const negatives=r.contributions.filter(d=>d.shap<0).sort((a,b)=>Math.abs(b.shap)-Math.abs(a.shap));
    const sumPos=positives.reduce((a,d)=>a+d.shap,0);
    const sumNeg=negatives.reduce((a,d)=>a-d.shap,0);
    const extremes=[r.base,r.logit,r.logit-sumPos,r.logit+sumNeg];
    let lo=Math.min(...extremes),hi=Math.max(...extremes);
    const center=(hi+lo)/2;
    const span=Math.max(hi-lo,1.65);
    lo=center-span/2-span*.11;
    hi=center+span/2+span*.11;
    const left=62,right=938,plotWidth=right-left;
    const xScale=v=>left+(v-lo)/(hi-lo)*plotWidth;
    const y=156;
    const defs=node('defs');
    const rg=node('linearGradient',{id:'force-warm',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
    rg.appendChild(node('stop',{offset:'0%','stop-color':'#f7a58d'}));
    rg.appendChild(node('stop',{offset:'100%','stop-color':'#ec776d'}));
    const bg=node('linearGradient',{id:'force-cool',x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
    bg.appendChild(node('stop',{offset:'0%','stop-color':'#439fbe'}));
    bg.appendChild(node('stop',{offset:'100%','stop-color':'#82c7dc'}));
    defs.append(rg,bg);svg.appendChild(defs);
    // A guide and a true shared log-odds axis.
    svg.appendChild(node('line',{x1:left,y1:y,x2:right,y2:y,stroke:'#e5ebee','stroke-width':4,'stroke-linecap':'round'}));
    for(let i=0;i<=5;i++) {
      const v=lo+(hi-lo)*i/5,x=xScale(v);
      svg.appendChild(node('line',{x1:x,y1:282,x2:x,y2:290,stroke:'#c7d5db','stroke-width':1}));
      svgText(svg,x,310,fmt(v,1),{'font-size':11,fill:'#171717'});
    }
    let cursor=r.logit;
    const redItems=[];
    for(const d of positives) {
      const a=cursor-d.shap,b=cursor;
      segmentArrow(svg,xScale(a),xScale(b),y,'right','url(#force-warm)');
      redItems.push({mid:xScale((a+b)/2),label:d.short+' '+signed(d.shap,2),name:d.short});
      cursor=a;
    }
    cursor=r.logit;
    const blueItems=[];
    for(const d of negatives) {
      const a=cursor,b=cursor-d.shap;
      segmentArrow(svg,xScale(a),xScale(b),y,'left','url(#force-cool)');
      blueItems.push({mid:xScale((a+b)/2),label:d.short+' '+signed(d.shap,2),name:d.short});
      cursor=b;
    }
    // Baseline and individual output reference markers.
    const xBase=xScale(r.base),xOut=xScale(r.logit);
    svg.appendChild(node('line',{x1:xBase,y1:118,x2:xBase,y2:191,stroke:'#6f91a0','stroke-width':2,'stroke-dasharray':'3 5',opacity:0.87}));
    svg.appendChild(node('line',{x1:xOut,y1:109,x2:xOut,y2:197,stroke:'#164f5b','stroke-width':2.3,opacity:0.95}));
    svg.appendChild(node('circle',{cx:xOut,cy:y,r:5.5,fill:'#153f4b',stroke:'#fff','stroke-width':2}));
    svg.appendChild(node('circle',{cx:xBase,cy:y,r:3.5,fill:'#8ba8b1',stroke:'#fff','stroke-width':1.5}));
    const baselineLabel=svgText(svg,xBase,206,'BASE',{'font-size':10,'font-weight':750,fill:'#171717'});
    const outputLabel=svgText(svg,xOut,225,'OUTPUT',{'font-size':10,'font-weight':850,fill:'#171717'});
    // Keep labels readable even when the model output and baseline nearly coincide.
    if(Math.abs(xBase-xOut)<55){baselineLabel.setAttribute('x',Math.max(left+30,xBase-32));outputLabel.setAttribute('x',Math.min(right-30,xOut+32));}
    layoutLabels(redItems);
    layoutLabels(blueItems);
    function drawLabels(items,positive) {
      for(const d of items) {
        const ly=positive?[45,70,95][d.row]:[239,255,271][d.row];
        const tx=d.labelX;
        const lineEnd=positive?ly+7:ly-13;
        svg.appendChild(node('polyline',{points:`${d.mid},${positive?137:175} ${d.mid},${positive?116:192} ${tx},${lineEnd}`,fill:'none',stroke:positive?'#e89a89':'#78b5cd','stroke-width':1.25,'stroke-opacity':.8,'stroke-linejoin':'round'}));
        svg.appendChild(node('circle',{cx:d.mid,cy:positive?137:175,r:2.4,fill:positive?'#e47c6d':'#479fbe'}));
        svgText(svg,tx,ly,d.label,{'font-size':12,'font-weight':750,fill:'#171717'});
      }
    }
    drawLabels(redItems,true);
    drawLabels(blueItems,false);
    if(!redItems.length) svgText(svg,245,76,'No positive contributions',{'font-size':12,fill:'#171717'});
    if(!blueItems.length) svgText(svg,775,242,'No negative contributions',{'font-size':12,fill:'#171717'});
  }
  // Start with six zero-valued inputs and no prediction until Calculate is pressed.
  function resetCalculator() {
    for (const feature of model.features) {
      byId(inputIds[feature.key]).value = probabilityKeys.has(feature.key) ? '0.000' : '0';
    }
    const error = byId('validation-error');
    error.textContent = '';
    error.hidden = true;
    byId('probability-value').textContent = '—';
    byId('probability-meter').style.width = '0%';
    const cls = byId('classification-badge');
    cls.textContent = '—';
    cls.classList.remove('is-positive');
    byId('classification-detail').textContent = '';
    byId('force-svg').replaceChildren();
  }
  // Format the three probability inputs without rounding an invalid value.
  for (const id of probabilityInputIds) {
    const input = byId(id);
    input.addEventListener('blur', () => {
      const raw = input.value.trim();
      const value = Number(raw);
      if (raw !== '' && Number.isFinite(value)
          && value >= 0 && value <= 1 && isThreeDecimals(value)) {
        input.value = value.toFixed(3);
      }
    });
  }
  byId('prediction-form').addEventListener('submit',event=>{event.preventDefault();predict();});
  byId('reset-button').addEventListener('click',resetCalculator);
  resetCalculator();
})();
